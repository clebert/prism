name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
          luac5.1 -p Prism.lua
          bash -n install.sh
